name: wanxiang2-release-publish

# 镜像宿主 release.yml：推 v* 标签 → 构建各平台自包含发行包 → 挂到「草稿」GitHub Release。
# 只建草稿，绝不自动发布；发布由人工在 Releases 页面确认。也可手动触发（只产出 artifact，不建 Release）。
# 构建/发布对象是 wanxiang2 自己的入口（app/Desktop），产包用 wanxiang2 自带的 ./x pack，
# 不依赖宿主仓库的任何脚本或路径。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（只用于包名，例如 v0.0.0-test）"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64, osx-arm64, osx-x64]
    # 不能叫 VERSION：MSBuild 把环境变量当属性读，$(Version)=v1.2.3 不是合法 NuGet 版本，restore 会静默失败。
    env:
      WX_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools workload (PWA 随桌面发布)
        run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools

      - name: Publish and package ${{ matrix.rid }}
        run: bash publish.sh ${{ matrix.rid }} "$WX_VERSION"

      # 只有 linux-x64 能在 ubuntu runner 上真跑起来：发布产物（含 PWA 与 avalonia.js 补丁）先冒烟再上传。
      - name: Smoke the published linux-x64 bundle
        if: matrix.rid == 'linux-x64'
        run: |
          npm ci
          bash tools/smoke_published.sh artifacts/publish/linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: wanxiang2-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update DRAFT release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 已存在：只在它仍是草稿时补传；已发布的 Release 不动。
            if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]; then
              echo "release $TAG already published; refusing to modify"; exit 1
            fi
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "万象2 $TAG" -R "$GITHUB_REPOSITORY"
          fi
